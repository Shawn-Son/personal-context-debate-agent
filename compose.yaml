services:
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 110s
    environment:
      APP_USERNAME: ${APP_USERNAME:-owner}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env before running Compose}
      APP_ORIGIN: ${APP_ORIGIN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VOICE_MODEL: ${OPENAI_VOICE_MODEL:-gpt-live-1}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-6-luna}
      OPENAI_VOICE: ${OPENAI_VOICE:-marin}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - debate-data:/app/data

volumes:
  debate-data:
